<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Квест: Станция «Музыкальная» (кабинет мастеров)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #1e2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .quiz-container {
            max-width: 900px;
            width: 100%;
            background: #fffaf0;
            background-image: radial-gradient(circle at 0% 30%, rgba(255, 215, 150, 0.2) 2%, transparent 2.5%);
            background-size: 30px 30px;
            border-radius: 56px 40px 56px 40px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 245, 200, 0.8);
            overflow: hidden;
        }
        .quiz-header {
            background: #2c2118;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 4px solid #e0a84b;
        }
        .score-box {
            background: #00000060;
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 100px;
            color: #ffefcf;
            font-weight: bold;
            font-size: 1.5rem;
            font-family: monospace;
        }
        .score-box span {
            color: #ffc857;
            font-size: 2rem;
            font-weight: 800;
            margin-right: 5px;
        }
        .timer-box {
            background: #1e2a2a;
            padding: 8px 20px;
            border-radius: 60px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.7rem;
            color: #f3bc6b;
            text-shadow: 0 0 4px #9b6a2c;
            box-shadow: inset 0 0 6px #00000033, 0 4px 8px rgba(0,0,0,0.2);
        }
        .timer-box.warning {
            background: #7a2e1f;
            color: #ffcd94;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; text-shadow: 0 0 0px #ff884d; }
            50% { opacity: 0.9; background: #9e3e28; text-shadow: 0 0 3px #ffb347; }
            100% { opacity: 1; }
        }
        .question-area {
            padding: 2rem 2rem 1.5rem;
        }
        .question-text {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 600;
            color: #2e2b1f;
            margin-bottom: 2rem;
            background: #fff5e6;
            padding: 1.3rem;
            border-radius: 40px;
            box-shadow: inset 0 1px 5px #c0a16b30, 0 6px 14px rgba(0,0,0,0.08);
            border-left: 12px solid #e09d3e;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }
        .option-btn {
            background: #efe2cf;
            border: 2px solid #c28a4a;
            border-radius: 60px;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #2c281e;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .option-btn:hover:not(:disabled) {
            background: #ffecb3;
            transform: scale(0.98);
            border-color: #b56f2a;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
            background: #cfbea3;
            border-color: #9b784a;
        }
        .result-screen {
            padding: 2rem;
            text-align: center;
        }
        .result-box {
            background: #e3d2b0;
            border-radius: 48px;
            padding: 2rem;
            margin: 1rem 0;
        }
        .final-score {
            font-size: 3.2rem;
            font-weight: bold;
            background: #2f2a1e;
            display: inline-block;
            padding: 0.2rem 1.8rem;
            border-radius: 60px;
            color: #ffe2a4;
            margin: 20px 0;
        }
        .restart-btn {
            background: #4a6b3c;
            border: none;
            font-size: 1.2rem;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            box-shadow: 0 6px 0 #2c4522;
        }
        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2c4522;
        }
        .message {
            font-size: 1rem;
            background: #f1e5ca;
            border-radius: 30px;
            padding: 10px;
            margin-top: 15px;
            color: #4a3516;
            text-align: center;
        }
        footer {
            font-size: 0.75rem;
            text-align: center;
            background: #2c2118;
            color: #cbae82;
            padding: 12px;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 550px) {
            .quiz-header {
                flex-direction: column;
                align-items: center;
            }
            .question-text {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 12px 16px;
                font-size: 1rem;
            }
        }
        .music-note {
            font-size: 1.2rem;
            margin-right: 6px;
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizRoot">
    <div class="quiz-header">
        <div class="score-box">🎵 БАЛЛЫ: <span id="scoreValue">0</span> / <span id="totalQuestionsSpan">6</span></div>
        <div class="timer-box" id="timerDisplay">05:00</div>
    </div>
    <div id="quizDynamicArea">
        <!-- динамическая загрузка вопросов / результатов -->
    </div>
    <footer>🎶 Станция «Музыкальная» — определи физическое явление. Каждый ответ — сразу балл и переход ➡️</footer>
</div>

<script>
    // ---------- ДАННЫЕ ВОПРОСОВ (Музыкальная станция) ----------
    // Вопросы с песнями и правильным физическим явлением (строго по условию)
    const QUESTIONS_DATA = [
        {
            text: "🎤 Песенка «Утро начинается…» (известная мелодия из передачи «Утренняя гимнастика» / «Утро начинается с зарядки»). О каком физическом явлении идёт речь?",
            correct: "вращение Земли вокруг своей оси",
            options: [
                "вращение Земли вокруг своей оси",
                "движение Луны по орбите",
                "инерция покоя",
                "центробежная сила"
            ]
        },
        {
            text: "🐊 Песня крокодила Гены «Пусть бегут неуклюже…» (Пусть бегут неуклюже пешеходы по лужам...). Какое физическое явление здесь описано?",
            correct: "механическое движение",
            options: [
                "механическое движение",
                "трение покоя",
                "испарение воды",
                "диффузия"
            ]
        },
        {
            text: "🌫️ Песня «Туман, туман…» (Туман, туман над лесом стелется...). О каком физическом явлении поется?",
            correct: "конденсация",
            options: [
                "конденсация",
                "испарение",
                "сублимация",
                "кристаллизация"
            ]
        },
        {
            text: "🎶 Песня «Крутится, вертится шар голубой…» (известная дворовая / туристическая). Какое физическое явление описывается?",
            correct: "вращательное движение",
            options: [
                "вращательное движение",
                "поступательное движение",
                "колебательное движение",
                "равномерное прямолинейное движение"
            ]
        },
        {
            text: "❄️ Песня «Падал белый снег» (Падал белый снег, словно плыл по ветру...). О каком явлении идёт речь?",
            correct: "сила тяжести",
            options: [
                "сила тяжести",
                "сила трения",
                "сила упругости",
                "сила Архимеда"
            ]
        },
        {
            text: "😂 Песня / звук «Детский смех» (в музыке часто используют семпл детского смеха). С каким физическим явлением связан смех, голос, его распространение?",
            correct: "звуковые волны",
            options: [
                "звуковые волны",
                "электромагнитные волны",
                "световые явления",
                "тепловое излучение"
            ]
        }
    ];

    // Состояние теста
    let currentIndex = 0;            
    let userAnswers = new Array(QUESTIONS_DATA.length).fill(null);
    let score = 0;                   
    let testActive = true;           
    let timerSeconds = 300;          // 5 минут
    let timerInterval = null;
    let questionLocked = false;      
    let isFinished = false;           

    const quizDynamic = document.getElementById('quizDynamicArea');
    const scoreSpan = document.getElementById('scoreValue');
    const totalSpan = document.getElementById('totalQuestionsSpan');
    const timerDisplay = document.getElementById('timerDisplay');
    const totalQuestions = QUESTIONS_DATA.length;
    totalSpan.textContent = totalQuestions;

    function updateScoreUI() {
        scoreSpan.textContent = score;
    }

    function finishTest(byTimer = false) {
        if (isFinished) return;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        isFinished = true;
        testActive = false;
        renderResultScreen();
    }

    function handleAnswer(selectedAnswer) {
        if (!testActive || isFinished) return;
        if (questionLocked) return;
        if (currentIndex >= totalQuestions) return;

        const currentQ = QUESTIONS_DATA[currentIndex];
        const isCorrect = (selectedAnswer === currentQ.correct);
        
        if (isCorrect) {
            score++;
            updateScoreUI();
        }
        
        userAnswers[currentIndex] = {
            answer: selectedAnswer,
            isCorrect: isCorrect
        };
        
        questionLocked = true;
        renderCurrentQuestion();  // показываем заблокированные кнопки и сообщение
        
        // Автоматический переход к следующему вопросу через небольшую задержку
        setTimeout(() => {
            if (!testActive || isFinished) return;
            if (currentIndex + 1 < totalQuestions) {
                currentIndex++;
                questionLocked = false;
                renderCurrentQuestion();
            } else {
                // последний вопрос, тест завершён
                finishTest(false);
            }
        }, 700);
    }

    function renderCurrentQuestion() {
        if (isFinished) return;
        if (!testActive && !isFinished) {
            finishTest(true);
            return;
        }
        if (currentIndex >= totalQuestions) {
            finishTest(false);
            return;
        }
        
        const q = QUESTIONS_DATA[currentIndex];
        let optionsHtml = '';
        for (let opt of q.options) {
            const disabledAttr = questionLocked ? 'disabled' : '';
            optionsHtml += `<button class="option-btn" data-answer="${escapeHtml(opt)}" ${disabledAttr}>🎵 ${escapeHtml(opt)}</button>`;
        }
        
        const messageBlock = questionLocked 
            ? '<div class="message">✅ Ответ засчитан! Переход к следующему вопросу...</div>' 
            : '<div class="message">🎧 Выберите одно физическое явление — балл начисляется сразу, изменить ответ нельзя.</div>';
        
        const html = `
            <div class="question-area">
                <div class="question-text">${escapeHtml(q.text)}</div>
                <div class="options-list" id="optionsContainer">
                    ${optionsHtml}
                </div>
                ${messageBlock}
            </div>
        `;
        quizDynamic.innerHTML = html;
        
        if (!questionLocked) {
            const btns = document.querySelectorAll('#optionsContainer .option-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (!testActive || isFinished || questionLocked) return;
                    const answerVal = btn.getAttribute('data-answer');
                    if (answerVal) handleAnswer(answerVal);
                });
            });
        }
    }

    function renderResultScreen() {
        if (timerInterval) clearInterval(timerInterval);
        testActive = false;
        isFinished = true;
        
        const percent = Math.round((score / totalQuestions) * 100);
        let messageText = '';
        if (score === totalQuestions) messageText = '🎼 Идеальный слух на физику! Вы — настоящий мастер! 🎶';
        else if (score >= totalQuestions/2) messageText = '🎤 Неплохо! Переслушайте хиты и повторите физические явления.';
        else messageText = '🎧 Попробуйте ещё раз, внимательно вслушиваясь в песни!';
        
        const resultHtml = `
            <div class="result-screen">
                <div class="result-box">
                    <h2>🎵 Тест завершён 🎵</h2>
                    <div class="final-score">${score} / ${totalQuestions}</div>
                    <p style="font-size:1.2rem">${messageText}</p>
                    <button class="restart-btn" id="restartTestBtn">🔄 Пройти станцию заново</button>
                    <div style="margin-top: 20px; font-size:0.9rem;">🎶 Музыка и физика — гармония науки!</div>
                </div>
            </div>
        `;
        quizDynamic.innerHTML = resultHtml;
        const restartBtn = document.getElementById('restartTestBtn');
        if (restartBtn) {
            restartBtn.addEventListener('click', () => resetFullTest());
        }
    }

    function resetFullTest() {
        if (timerInterval) clearInterval(timerInterval);
        currentIndex = 0;
        userAnswers = new Array(QUESTIONS_DATA.length).fill(null);
        score = 0;
        testActive = true;
        timerSeconds = 300;
        questionLocked = false;
        isFinished = false;
        updateScoreUI();
        updateTimerDisplay();
        startTimer();
        renderCurrentQuestion();
        timerDisplay.classList.remove('warning');
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        if (timerSeconds <= 60) {
            timerDisplay.classList.add('warning');
        } else {
            timerDisplay.classList.remove('warning');
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!testActive || isFinished) return;
            if (timerSeconds <= 1) {
                clearInterval(timerInterval);
                timerInterval = null;
                timerSeconds = 0;
                updateTimerDisplay();
                if (!isFinished) {
                    testActive = false;
                    finishTest(true);
                }
            } else {
                timerSeconds--;
                updateTimerDisplay();
                if (!testActive && !isFinished) {
                    if (timerInterval) clearInterval(timerInterval);
                }
            }
        }, 1000);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    function initTest() {
        updateScoreUI();
        startTimer();
        renderCurrentQuestion();
    }
    
    initTest();
</script>
</body>
</html>
