<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Квест: Станция «Люди Науки» (рандомные варианты ответов)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1a3c2c 0%, #0e2a1d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Merriweather', serif;
            margin: 0;
            padding: 20px;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #fef7e0;
            background-image: radial-gradient(circle at 10% 20%, rgba(210, 180, 140, 0.1) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 64px 48px 64px 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 200, 0.6);
            overflow: hidden;
            transition: all 0.2s;
        }
        .quiz-header {
            background: #2b2b1f;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 4px solid #e0b354;
        }
        .score-box {
            background: #00000070;
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 100px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.5rem;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .score-box span {
            color: #ffd966;
            font-size: 2rem;
            font-weight: 800;
            margin-right: 5px;
        }
        .timer-box {
            background: #1e2a1c;
            padding: 8px 20px;
            border-radius: 60px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.7rem;
            color: #f3c26b;
            text-shadow: 0 0 4px #ae7c2e;
            box-shadow: inset 0 0 6px #00000033, 0 4px 8px rgba(0,0,0,0.2);
        }
        .timer-box.warning {
            background: #6b2e1a;
            color: #ffbe8c;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; text-shadow: 0 0 0px red; }
            50% { opacity: 0.9; text-shadow: 0 0 3px #ff7b2c; background: #8f3a1f;}
            100% { opacity: 1; }
        }
        .question-area {
            padding: 2rem 2rem 1.5rem;
        }
        .question-text {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 600;
            color: #2c2b1f;
            margin-bottom: 2rem;
            background: #fff3df;
            padding: 1.2rem;
            border-radius: 40px;
            box-shadow: inset 0 1px 5px #c0a16b30, 0 6px 12px rgba(0,0,0,0.08);
            border-left: 12px solid #d9a13b;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }
        .option-btn {
            background: #f5ede1;
            border: 2px solid #c7a86b;
            border-radius: 60px;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #2d2b20;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .option-btn:hover:not(:disabled) {
            background: #eedfa8;
            transform: scale(0.98);
            border-color: #b37b2e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .option-btn.disabled-true, .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
            background: #dbceb5;
            border-color: #9b7c4d;
        }
        .result-screen {
            padding: 2rem;
            text-align: center;
        }
        .result-box {
            background: #d9caa3;
            border-radius: 48px;
            padding: 2rem;
            margin: 1rem 0;
        }
        .final-score {
            font-size: 3.2rem;
            font-weight: bold;
            background: #2e2a1f;
            display: inline-block;
            padding: 0.2rem 1.8rem;
            border-radius: 60px;
            color: #ffdfa5;
            margin: 20px 0;
        }
        .restart-btn {
            background: #3f6b3a;
            border: none;
            font-size: 1.2rem;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            box-shadow: 0 6px 0 #1f3a1c;
        }
        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1f3a1c;
        }
        .message {
            font-size: 1rem;
            background: #e9ddb0;
            border-radius: 30px;
            padding: 10px;
            margin-top: 15px;
            color: #4c3516;
        }
        footer {
            font-size: 0.75rem;
            text-align: center;
            background: #2b2b1f;
            color: #bbaa7a;
            padding: 10px;
        }
        @media (max-width: 550px) {
            .quiz-header {
                flex-direction: column;
                align-items: center;
            }
            .question-text {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 12px 16px;
                font-size: 1rem;
            }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizRoot">
    <div class="quiz-header">
        <div class="score-box">🏆 БАЛЛЫ: <span id="scoreValue">0</span> / <span id="totalQuestionsSpan">4</span></div>
        <div class="timer-box" id="timerDisplay">05:00</div>
    </div>
    <div id="quizDynamicArea">
        <!-- динамически: вопросы или результат -->
    </div>
    <footer>📜 Станция «Люди Науки» · Ответ единожды, балл засчитывается сразу · Варианты ответов в случайном порядке</footer>
</div>

<script>
    // ---------- ОСНОВНЫЕ ДАННЫЕ ВОПРОСОВ (правильные ответы неизменны) ----------
    const RAW_QUESTIONS = [
        {
            text: "► Он — один из первых ученых, работавших на войну, и первая жертва войны среди людей науки; круг его научных интересов: математика, механика, оптика, астрономия; с одним из его открытий мы сталкиваемся каждую неделю; он сказал: «Дайте мне точку опоры и я переверну Землю»; по легенде, ему принадлежит возглас «Эврика!», прозвучавший вслед за сделанным им открытием.",
            correct: "Архимед",
            options: ["Архимед", "Пифагор", "Евклид", "Аристотель"]
        },
        {
            text: "► Он жил в IV веке в Италии; занимался физикой и астрономией, изучал движение тел, открыл закон колебаний маятника, создал теорию простых механизмов; создал первый телескоп (зрительную трубу) и наблюдал в него Луну и планеты, обнаружил спутники Юпитера, пятна на Солнце и фазы Венеры; поддерживал и развивал гелиоцентрическую теорию Коперника, за что преследовался инквизицией. На суде он публично отрекся от своих взглядов; его называют «отцом» экспериментальной физики, человеком, от которого начинается физика как наука.",
            correct: "Галилей",
            options: ["Галилео Галилей", "Джордано Бруно", "Исаак Ньютон", "Коперник"]
        },
        {
            text: "► Русский ученый, положивший начало разработке общепринятой научной и технической терминологии на русском языке; он первым в России разработал способ получения цветных стекол, вместе со своими учениками создал из этих стекол панораму «Полтавская битва»; он ввел в русский язык слово «физика»; первый русский академик; о нем А.С. Пушкин писал: «Он создал первый русский университет. Он, лучше сказать, был самым первым нашим университетом».",
            correct: "М.В. Ломоносов",
            options: ["М.В. Ломоносов", "Д.И. Менделеев", "И.П. Павлов", "Н.И. Лобачевский"]
        },
        {
            text: "► Он родился в 1643 г. в Англии; является создателем современного естествознания, прославился трудами по механике, оптике, астрономии, математике; дал определение трем основным принципам механики, открыл закон всемирного тяготения и на его базе разработал теорию движения планет; внес огромный вклад в оптику, впервые разложил белый свет на семь цветов призмой. Он придерживался корпускулярной теории света (свет – это поток частиц); его научное творчество сыграло исключительную роль в развитии физики.",
            correct: "И. Ньютон",
            options: ["И. Ньютон", "Р. Гук", "Г. Лейбниц", "Б. Паскаль"]
        }
    ];

    // Функция перемешивания массива (Fisher-Yates)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Создаём копию вопросов с перемешанными вариантами ответов
    function buildShuffledQuestions() {
        return RAW_QUESTIONS.map(q => {
            const shuffledOpts = shuffleArray([...q.options]);
            return {
                text: q.text,
                correct: q.correct,
                options: shuffledOpts
            };
        });
    }

    // Инициализируем переменные
    let QUESTIONS = buildShuffledQuestions();
    let TOTAL_QS = QUESTIONS.length;
    let currentIndex = 0;
    let userAnswers = new Array(TOTAL_QS).fill(null);
    let score = 0;
    let testActive = true;
    let timerSeconds = 300;          // 5 минут
    let timerInterval = null;
    let questionLocked = false;
    let isFinished = false;

    const quizDynamic = document.getElementById('quizDynamicArea');
    const scoreSpan = document.getElementById('scoreValue');
    const totalSpan = document.getElementById('totalQuestionsSpan');
    const timerDisplay = document.getElementById('timerDisplay');
    totalSpan.textContent = TOTAL_QS;

    function updateScoreUI() {
        scoreSpan.textContent = score;
    }

    function finishTest(byTimer = false) {
        if (isFinished) return;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        isFinished = true;
        testActive = false;
        renderResultScreen();
    }

    function handleAnswer(selectedAnswer) {
        if (!testActive || isFinished) return;
        if (questionLocked) return;
        if (currentIndex >= TOTAL_QS) return;

        const currentQ = QUESTIONS[currentIndex];
        const isCorrect = (selectedAnswer === currentQ.correct);
        
        if (isCorrect) {
            score++;
            updateScoreUI();
        }
        
        userAnswers[currentIndex] = {
            answer: selectedAnswer,
            isCorrect: isCorrect
        };
        
        questionLocked = true;
        renderCurrentQuestion();
        
        setTimeout(() => {
            if (!testActive || isFinished) return;
            if (currentIndex + 1 < TOTAL_QS) {
                currentIndex++;
                questionLocked = false;
                renderCurrentQuestion();
            } else {
                finishTest(false);
            }
        }, 600);
    }

    function renderCurrentQuestion() {
        if (isFinished) return;
        if (!testActive && !isFinished) {
            finishTest(true);
            return;
        }
        if (currentIndex >= TOTAL_QS) {
            finishTest(false);
            return;
        }

        const q = QUESTIONS[currentIndex];
        let optionsHtml = '';
        for (let opt of q.options) {
            const disabledAttr = questionLocked ? 'disabled' : '';
            const escapedOpt = opt.replace(/['"]/g, '&quot;');
            optionsHtml += `<button class="option-btn" data-answer="${escapedOpt}" ${disabledAttr}>${escapeHtml(opt)}</button>`;
        }
        
        const messageHtml = questionLocked 
            ? '<div class="message">✅ Ответ засчитан! Переход к следующему вопросу...</div>'
            : '<div class="message">🔍 Выберите один вариант — балл начисляется сразу, ответ изменить нельзя.</div>';
        
        const html = `
            <div class="question-area">
                <div class="question-text">${escapeHtml(q.text)}</div>
                <div class="options-list" id="optionsContainer">
                    ${optionsHtml}
                </div>
                ${messageHtml}
            </div>
        `;
        quizDynamic.innerHTML = html;
        
        if (!questionLocked) {
            const btns = document.querySelectorAll('#optionsContainer .option-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (!testActive || isFinished || questionLocked) return;
                    const answerVal = btn.getAttribute('data-answer');
                    if (answerVal) handleAnswer(answerVal);
                });
            });
        }
    }

    function renderResultScreen() {
        if (timerInterval) clearInterval(timerInterval);
        testActive = false;
        isFinished = true;
        
        let messageText = '';
        if (score === TOTAL_QS) messageText = '🌟 Блестяще! Вы знаете людей науки! 🌟';
        else if (score >= TOTAL_QS/2) messageText = '📚 Хороший результат, но можно лучше!';
        else messageText = '📖 Перечитайте материалы станции и попробуйте снова!';

        const resultHtml = `
            <div class="result-screen">
                <div class="result-box">
                    <h2>🏁 Тест завершён 🏁</h2>
                    <div class="final-score">${score} / ${TOTAL_QS}</div>
                    <p style="font-size:1.2rem">${messageText}</p>
                    <button class="restart-btn" id="restartTestBtn">🔄 Пройти станцию заново</button>
                    <div style="margin-top: 20px; font-size:0.9rem;">Спасибо за участие в квесте!</div>
                </div>
            </div>
        `;
        quizDynamic.innerHTML = resultHtml;
        const restartBtn = document.getElementById('restartTestBtn');
        if (restartBtn) {
            restartBtn.addEventListener('click', () => resetFullTest());
        }
    }

    function resetFullTest() {
        if (timerInterval) clearInterval(timerInterval);
        // Заново перемешиваем варианты ответов
        QUESTIONS = buildShuffledQuestions();
        TOTAL_QS = QUESTIONS.length;
        currentIndex = 0;
        userAnswers = new Array(TOTAL_QS).fill(null);
        score = 0;
        testActive = true;
        timerSeconds = 300;
        questionLocked = false;
        isFinished = false;
        totalSpan.textContent = TOTAL_QS;
        updateScoreUI();
        updateTimerDisplay();
        startTimer();
        renderCurrentQuestion();
        timerDisplay.classList.remove('warning');
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        if (timerSeconds <= 60) {
            timerDisplay.classList.add('warning');
        } else {
            timerDisplay.classList.remove('warning');
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!testActive || isFinished) return;
            if (timerSeconds <= 1) {
                clearInterval(timerInterval);
                timerInterval = null;
                timerSeconds = 0;
                updateTimerDisplay();
                if (!isFinished) {
                    testActive = false;
                    finishTest(true);
                }
            } else {
                timerSeconds--;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function initTest() {
        updateScoreUI();
        startTimer();
        renderCurrentQuestion();
    }
    
    initTest();
</script>
</body>
</html>
